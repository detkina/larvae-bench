<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>LARVAE — skill bench on Jolt</title>
<style>
  :root { color-scheme: light; }
  /* forced dark mode repaints background-color, not background-image;
     -webkit-text-fill-color survives its text pass */
  html, body {
    margin: 0; padding: 0;
    background-color: #fff; background-image: linear-gradient(#fff, #fff);
    color: #000; -webkit-text-fill-color: #000;
    font-family: Helvetica, Arial, sans-serif; font-size: 13px; line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  div, span, label, p, td, th, h1, h2 { -webkit-text-fill-color: inherit; }
  .bench-table { border-collapse: collapse; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
  .bench-table td, .bench-table th { border-bottom: 1px solid #ddd; padding: 2px 10px 2px 0; text-align: left; }
  .bench-table th { font-weight: bold; border-bottom: 1px solid #000; }
  details summary { cursor: pointer; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
</style>
<script>
/* harness.js, built in */
/* ============================================================
   harness.js — the common frame every LARVAE page runs in.

   It owns time, randomness, the controls and the record. It knows
   nothing about larvae, glass or bowls: a page hands it a factory
   that builds a simulation, and the harness runs it.

   What a page gives the harness (the "sim" contract):
     create(params, rng)  -> sim
     sim.step(dt)                    advance one tick
     sim.draw(ctx, w, h)             paint the current state
     sim.status() -> {action, reason, detail}   what it is doing and why, in English
     sim.snapshot() -> plain object  what to keep in the log for this tick
     sim.invariants -> [{name, check(prev, cur) -> null | message}]
                                     prev/cur are snapshots; a message pauses the run
     sim.pointer(kind, x, y, extra)  optional: mouse in canvas pixels
     sim.done() -> null | {ok, why}  optional: the run has reached its end

   Determinism: fixed dt, every random number from a named generator
   seeded from one seed. Same seed + same parameters = same run, bit
   for bit, whatever ran before it.
   ============================================================ */
(function (root) {
  'use strict';

  const VERSION = '1.0';
  const DT = 1 / 30;            // one tick = 1/30 s of animal time, always
  const RECENT_TICKS = 300;     // ten seconds of snapshots kept for the log
  const MAX_TRANSITIONS = 400;

  /* ---------- randomness: one seed, many named streams ---------- */
  function hashString(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // rng('larva') and rng('target') never disturb each other
  function makeRng(seed) {
    const streams = {};
    return function rng(name) {
      if (!streams[name]) {
        const r = mulberry32((hashString(String(name)) ^ (seed >>> 0)) >>> 0);
        streams[name] = {
          next: r,
          range: (a, b) => a + r() * (b - a),
          sign: () => (r() < 0.5 ? -1 : 1)
        };
      }
      return streams[name];
    };
  }

  /* ---------- parameters: schema -> safe values ---------- */
  // A field: {key, label, type:'number'|'select', min, max, step, value, unit, status, hint, options}
  // status is the audit category: 'measured', 'body-derived', 'pose-derived', 'free'.
  function clampParams(schema, raw) {
    const out = {};
    for (const f of schema) {
      let v = raw && raw[f.key] !== undefined ? raw[f.key] : f.value;
      if (f.type === 'number') {
        v = parseFloat(v);
        if (!isFinite(v)) v = f.value;
        v = Math.min(f.max, Math.max(f.min, v));
        if (f.step) v = Math.round(v / f.step) * f.step;
        v = +v.toFixed(6);
      } else if (f.type === 'select') {
        const ok = f.options.some(o => o.value === v && !o.disabled);
        if (!ok) v = f.value;
      }
      out[f.key] = v;
    }
    return out;
  }

  /* ---------- the run itself, with no screen ---------- */
  function Run(factory, params, seed) {
    this.factory = factory;
    this.params = params;
    this.seed = seed >>> 0;
    this.sim = factory.create(params, makeRng(this.seed));
    this.tick = 0;
    this.transitions = [];
    this.violations = [];
    this.marks = [];
    this.recent = [];
    this.lastStatusKey = '';
    this.prev = this.sim.snapshot();
    this.finished = null;
    this.noteStatus();
  }
  Run.prototype.time = function () { return this.tick * DT; };
  Run.prototype.noteStatus = function () {
    const s = this.sim.status();
    const key = s.action + '|' + s.reason;
    if (key !== this.lastStatusKey) {
      this.lastStatusKey = key;
      this.transitions.push({ tick: this.tick, t: +this.time().toFixed(2), action: s.action, reason: s.reason });
      if (this.transitions.length > MAX_TRANSITIONS) this.transitions.shift();
    }
  };
  // returns null, or the violation that stopped it
  Run.prototype.step = function () {
    if (this.finished) return null;
    this.sim.step(DT);
    this.tick++;
    const cur = this.sim.snapshot();
    cur.tick = this.tick;
    this.recent.push(cur);
    if (this.recent.length > RECENT_TICKS) this.recent.shift();
    let hit = null;
    if (!cur.skipChecks) {
      for (const inv of this.sim.invariants || []) {
        const msg = inv.check(this.prev, cur);
        if (msg) { hit = { tick: this.tick, t: +this.time().toFixed(2), name: inv.name, message: msg }; break; }
      }
    }
    if (hit) this.violations.push(hit);
    this.prev = cur;
    this.noteStatus();
    if (this.sim.done) {
      const d = this.sim.done();
      if (d) this.finished = Object.assign({ tick: this.tick, t: +this.time().toFixed(2) }, d);
    }
    return hit;
  };
  Run.prototype.mark = function (text) {
    const s = this.sim.status();
    this.marks.push({
      tick: this.tick, t: +this.time().toFixed(2), text: text,
      action: s.action, reason: s.reason, detail: s.detail || '',
      around: this.recent.slice()   // the ten seconds before the mark
    });
  };
  Run.prototype.journal = function (page) {
    return {
      page: page, harness: VERSION, saved: new Date().toISOString(),
      seed: this.seed, params: this.params, tick: this.tick, t: +this.time().toFixed(2),
      finished: this.finished, violations: this.violations,
      transitions: this.transitions, marks: this.marks, recent: this.recent
    };
  };

  // for checks and for batch pages: run to the end with no drawing at all
  function runHeadless(factory, params, seed, maxTicks) {
    const r = new Run(factory, params, seed);
    let hit = null;
    while (!r.finished && r.tick < maxTicks && !hit) hit = r.step();
    return { run: r, violation: hit, finished: r.finished, tick: r.tick, t: r.time() };
  }

  /* ---------- the screen ---------- */
  const CSS = `
  .hz-wrap{max-width:1100px;margin:0 auto;padding:14px 16px 40px}
  .hz-wrap [hidden]{display:none!important}
  .hz-wrap h1{font-size:13px;font-weight:bold;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px}
  .hz-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 18px;margin-bottom:12px}
  .hz-field label{display:block;margin-bottom:3px}
  .hz-field .hz-status{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
  .hz-field .hz-hint{font-size:11px}
  .hz-field input,.hz-field select{font:inherit;width:100%;padding:5px 6px;border:1px solid #000;border-radius:0;
    background-color:#fff;background-image:linear-gradient(#fff,#fff);color:#000;-webkit-text-fill-color:#000;
    -webkit-appearance:none;appearance:none}
  .hz-bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .hz-bar button{font:inherit;padding:6px 14px;border:1px solid #000;border-radius:0;cursor:pointer;
    background-color:#fff;background-image:linear-gradient(#fff,#fff);color:#000;-webkit-text-fill-color:#000}
  .hz-bar button:disabled{border-color:#bbb;color:#bbb;-webkit-text-fill-color:#bbb;cursor:default}
  .hz-bar button.hz-go{font-weight:bold}
  .hz-markbox input{font:inherit;flex:1;min-width:0;padding:5px 6px;border:1px solid #000;border-radius:0;
    background-color:#fff;background-image:linear-gradient(#fff,#fff);color:#000;-webkit-text-fill-color:#000}
  .hz-bar select{font:inherit;padding:5px;border:1px solid #000;border-radius:0;background-image:linear-gradient(#fff,#fff);
    color:#000;-webkit-text-fill-color:#000}
  .hz-state{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;border-top:1px solid #000;
    border-bottom:1px solid #000;padding:6px 0;margin:6px 0;min-height:3.2em}
  .hz-state .hz-action{font-weight:bold}
  .hz-alert{color:#c00;-webkit-text-fill-color:#c00}
  .hz-mute{color:#666;-webkit-text-fill-color:#666}
  .hz-canvas{display:block;width:100%;height:auto;border:0;touch-action:none;
    background-image:linear-gradient(#fff,#fff)}
  .hz-meta{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;margin-top:4px}
  .hz-log{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;max-height:9.5em;overflow-y:auto;margin-top:8px}
  .hz-extra{margin-top:12px}
  `;

  function el(tag, attrs, kids) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(c => c && e.appendChild(c));
    return e;
  }

  const STATUS_WORDS = {
    'measured': 'measured', 'body-derived': 'from the body', 'pose-derived': 'from the poses', 'free': 'free choice'
  };

  /*
    mount(config):
      host      element to build into
      title     page title
      page      file name, goes into the journal
      factory   {create}
      schema    parameter fields
      canvas    {width, height} in canvas pixels (logical)
      extra     optional function(container) for a page's own read-only panel
      onFrame   optional function(run) after each paint
  */
  function mount(cfg) {
    if (!document.getElementById('hz-style')) {
      const st = el('style', { id: 'hz-style' }); st.textContent = CSS; document.head.appendChild(st);
    }
    const host = cfg.host;
    const wrap = el('div', { class: 'hz-wrap' });
    host.appendChild(wrap);
    wrap.appendChild(el('h1', { text: cfg.title }));

    // 1. parameters
    const form = el('div', { class: 'hz-form' });
    const inputs = {};
    for (const f of cfg.schema) {
      let input;
      const id = 'hz-in-' + f.key.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
      if (f.type === 'select') {
        input = el('select', { id });
        for (const o of f.options) {
          const op = el('option', { value: o.value, text: o.label });
          if (o.disabled) op.disabled = true;
          input.appendChild(op);
        }
        input.value = f.value;
      } else {
        input = el('input', { id, type: 'number', min: f.min, max: f.max, step: f.step || 'any', value: f.value });
        input.addEventListener('change', () => {
          const v = clampParams([f], { [f.key]: input.value })[f.key];
          input.value = v;
        });
      }
      inputs[f.key] = input;
      const range = f.type === 'number' ? ' (' + f.min + '–' + f.max + (f.unit ? ' ' + f.unit : '') + ')' : '';
      form.appendChild(el('div', { class: 'hz-field' }, [
        el('label', { for: id, text: f.label + range }),
        input,
        f.status ? el('div', { class: 'hz-status hz-mute', text: STATUS_WORDS[f.status] || f.status }) : null,
        f.hint ? el('div', { class: 'hz-hint hz-mute', text: f.hint }) : null
      ]));
    }
    // seed: empty = take a new one from the clock at Пуск
    const seedIn = el('input', { id: 'hz-in-seed', type: 'number', min: 0, max: 4294967295, step: 1, placeholder: 'auto' });
    form.appendChild(el('div', { class: 'hz-field' }, [
      el('label', { for: 'hz-in-seed', text: 'Seed' }), seedIn,
      el('div', { class: 'hz-hint hz-mute', text: 'Пусто — новое число при каждом «Пуске». Одно и то же число — тот же самый прогон.' })
    ]));
    wrap.appendChild(form);

    // 2. controls
    const bGo = el('button', { id: 'hz-btn-go', class: 'hz-go', text: 'Пуск' });
    const bPause = el('button', { id: 'hz-btn-pause', text: 'Пауза' });
    const bStep = el('button', { id: 'hz-btn-step', text: 'Шаг' });
    const bReset = el('button', { id: 'hz-btn-reset', text: 'Сброс' });
    const bMark = el('button', { id: 'hz-btn-mark', text: 'Отметить' });
    const bSave = el('button', { id: 'hz-btn-save', text: 'Скачать журнал' });
    const speed = el('select', { id: 'hz-speed', title: 'скорость показа' });
    [1, 2, 4, 8].forEach(k => speed.appendChild(el('option', { value: k, text: '×' + k })));
    wrap.appendChild(el('div', { class: 'hz-bar' }, [bGo, bPause, bStep, bReset, bMark, bSave, speed]));
    // the mark is typed in the page itself: some viewers never show prompt()
    const markIn = el('input', { id: 'hz-in-mark', type: 'text', placeholder: 'Что не так? Одна строка, Enter' });
    const markOk = el('button', { id: 'hz-btn-mark-ok', text: 'Записать' });
    const markBox = el('div', { class: 'hz-bar hz-markbox' }, [markIn, markOk]);
    markBox.hidden = true;
    wrap.appendChild(markBox);

    // 3. what it is doing
    const state = el('div', { class: 'hz-state', id: 'hz-state' });
    wrap.appendChild(state);

    // 4. picture
    const canvas = el('canvas', { class: 'hz-canvas', id: 'hz-canvas' });
    const W = cfg.canvas.width, H = cfg.canvas.height;
    const dpr = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    canvas.style.maxWidth = W + 'px';
    wrap.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    const meta = el('div', { class: 'hz-meta hz-mute', id: 'hz-meta' });
    wrap.appendChild(meta);
    const log = el('div', { class: 'hz-log', id: 'hz-log' });
    wrap.appendChild(log);
    const extra = el('div', { class: 'hz-extra' });
    wrap.appendChild(extra);
    if (cfg.extra) cfg.extra(extra);

    let run = null, paused = true, lastParams = null, alertMsg = '';

    function readParams() {
      const raw = {};
      for (const k in inputs) raw[k] = inputs[k].value;
      const p = clampParams(cfg.schema, raw);
      for (const k in inputs) inputs[k].value = p[k];
      return p;
    }
    function start(params, seed) {
      run = new Run(cfg.factory, params, seed);
      lastParams = params;
      alertMsg = '';
      paused = false;
      refresh();
    }
    function refresh() {
      bPause.textContent = paused ? 'Дальше' : 'Пауза';
      [bPause, bStep, bReset, bMark, bSave].forEach(b => (b.disabled = !run));
      if (!run) {
        state.innerHTML = '<span class="hz-mute">Задай параметры и нажми «Пуск».</span>';
        return;
      }
      const s = run.sim.status();
      let html = '<span class="hz-action">' + esc(s.action) + '</span> — ' + esc(s.reason);
      if (s.detail) html += '<br><span class="hz-mute">' + esc(s.detail) + '</span>';
      if (alertMsg) html += '<br><span class="hz-alert">' + esc(alertMsg) + '</span>';
      else if (run.finished) html += '<br><b>' + esc((run.finished.ok ? 'DONE — ' : 'FAILED — ') + run.finished.why) + '</b>';
      else if (paused) html += '<br><span class="hz-mute">PAUSED</span>';
      state.innerHTML = html;
      meta.textContent = 'seed ' + run.seed + ' · t ' + run.time().toFixed(1) + ' s · tick ' + run.tick +
        ' · marks ' + run.marks.length + ' · violations ' + run.violations.length;
      log.innerHTML = run.transitions.slice(-30).reverse()
        .map(x => x.t.toFixed(1) + ' s  ' + esc(x.action) + ' — ' + esc(x.reason)).join('<br>');
    }
    function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

    function paint() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
      if (run) run.sim.draw(ctx, W, H);
      else if (cfg.factory.drawEmpty) cfg.factory.drawEmpty(ctx, W, H);
    }
    function tickOnce() {
      const hit = run.step();
      if (hit) { paused = true; alertMsg = 'PAUSED — ' + hit.name + ': ' + hit.message; }
      if (run.finished) paused = true;
    }

    bGo.onclick = () => {
      const p = readParams();
      let seed = parseInt(seedIn.value, 10);
      // a typed seed stays in the field; an empty field draws a new one each time
      if (!isFinite(seed)) seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
      start(p, seed);
    };
    bPause.onclick = () => { if (!run) return; if (run.finished) return; paused = !paused; if (!paused) alertMsg = ''; refresh(); };
    bStep.onclick = () => { if (!run) return; paused = true; alertMsg = ''; tickOnce(); paint(); refresh(); };
    bReset.onclick = () => { if (!run) return; const s = run.seed; start(lastParams, s); paused = true; paint(); refresh(); };
    bMark.onclick = () => {
      if (!run) return;
      paused = true; markBox.hidden = false; markIn.value = ''; markIn.focus(); refresh();
    };
    function commitMark() {
      const text = markIn.value.trim();
      if (text && run) { run.mark(text); alertMsg = ''; }
      markBox.hidden = true; refresh();
    }
    markOk.onclick = commitMark;
    markIn.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commitMark(); }
      if (e.key === 'Escape') { markBox.hidden = true; }
    });
    bSave.onclick = () => {
      if (!run) return;
      const text = JSON.stringify(run.journal(cfg.page), null, 1);
      const name = cfg.page.replace(/\.html$/, '') + '-seed' + run.seed + '-t' + Math.round(run.time()) + '.json';
      const blob = new Blob([text], { type: 'application/json' });
      const a = el('a', { href: URL.createObjectURL(blob), download: name });
      document.body.appendChild(a); a.click(); a.remove();
      // inside an embedded viewer the download can be blocked silently: copy as well
      if (window.self !== window.top && navigator.clipboard) {
        navigator.clipboard.writeText(text).then(
          () => { alertMsg = 'Журнал скопирован в буфер — вставь его в чат (здесь файл может не скачаться).'; refresh(); },
          () => {});
      }
    };
    window.addEventListener('keydown', e => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
      if (e.target && e.target.isContentEditable) return;
      if (e.code === 'Space') { e.preventDefault(); bPause.click(); }
      else if (e.key === 's' || e.key === 'S') bStep.click();
    });

    // the mouse, in logical canvas pixels
    function pos(e) {
      const r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
    }
    let down = false;
    canvas.addEventListener('pointerdown', e => {
      if (!run || !run.sim.pointer) return;
      down = true; canvas.setPointerCapture(e.pointerId);
      const p = pos(e); run.sim.pointer('down', p.x, p.y); paint(); refresh();
    });
    canvas.addEventListener('pointermove', e => {
      if (!down || !run || !run.sim.pointer) return;
      const p = pos(e); run.sim.pointer('move', p.x, p.y); paint();
    });
    canvas.addEventListener('pointerup', e => {
      if (!down || !run || !run.sim.pointer) return;
      down = false; const p = pos(e); run.sim.pointer('up', p.x, p.y); paint(); refresh();
    });
    canvas.addEventListener('wheel', e => {
      if (!run || !run.sim.pointer) return;
      const p = pos(e);
      if (run.sim.pointer('wheel', p.x, p.y, { delta: e.deltaY > 0 ? 1 : -1 })) { e.preventDefault(); paint(); }
    }, { passive: false });

    // real time drives the clock, but the simulation only ever sees whole ticks
    let acc = 0, lastT = null;
    function frame(now) {
      if (lastT === null) lastT = now;
      let elapsed = (now - lastT) / 1000; lastT = now;
      if (elapsed > 0.25) elapsed = 0.25;   // a stalled tab must not make the animal jump
      if (run && !paused) {
        acc += elapsed * parseInt(speed.value, 10);
        let n = 0;
        while (acc >= DT && n < 64 && !paused) { tickOnce(); acc -= DT; n++; }
        if (n === 64) acc = 0;
        refresh();
      } else acc = 0;
      paint();
      if (cfg.onFrame && run) cfg.onFrame(run);
      requestAnimationFrame(frame);
    }
    refresh();
    requestAnimationFrame(frame);
    return { get run() { return run; } };
  }

  root.Harness = { VERSION, DT, makeRng, clampParams, Run, runHeadless, mount };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* physics.js, built in */
/* LARVAE — physics layer (Jolt).
   One solver for everything that touches: floor, glasses, stones, the larva.
   Units: cm, g, s. Jolt's Y is up; the bench's floor plane is (x, y) → Jolt (x, z).

   The larva:
   - tail and middle are soft: short segments on stiff springs, drawn after a
     skeleton that the skills move. Where something presses on them they give
     way a little and spring back;
   - the head is hard: a rigid ball, moved by the skeleton, that nothing enters.
   Glasses are rigid, they do not bounce. They are moved only by the solver:
   by gravity, the floor, and what the larva's body, head and legs do to them.

   The skills do not place glasses. They move the skeleton (and, with the legs,
   push on a glass with a limited force); the solver decides the rest. */
(function (root) {
  'use strict';

  const LAYER_STATIC = 0, LAYER_MOVING = 1, LAYER_LARVA = 2, LAYER_GHOST = 3, NUM_LAYERS = 4;
  const G = 981;                         // cm/s²
  const GLASS_DENSITY = 2.5;             // g/cm³

  let J = null;                          // the Jolt module, once loaded

  async function load(opts = {}) {
    if (J) return J;
    const factory = opts.factory || root.JoltFactory;
    J = await factory();
    root.Physics.ready = true;
    return J;
  }

  const v3 = (x, y, z) => new J.Vec3(x, y, z);
  const r3 = (x, y, z) => new J.RVec3(x, y, z);
  // rotate a vector by a quaternion (x, y, z, w)
  const qrot = (qx, qy, qz, qw, x, y, z) => {
    const tx = 2 * (qy * z - qz * y), ty = 2 * (qz * x - qx * z), tz = 2 * (qx * y - qy * x);
    return [x + qw * tx + (qy * tz - qz * ty), y + qw * ty + (qz * tx - qx * tz), z + qw * tz + (qx * ty - qy * tx)];
  };
  // bench (x, y, z-up) → Jolt (x, z-up, y)
  const toJ = (x, y, z) => [x, z, y];

  function createWorld(opts = {}) {
    if (!J) throw new Error('physics: call Physics.load() first');
    const settings = new J.JoltSettings();
    settings.mMaxWorkerThreads = opts.threads !== undefined ? opts.threads : (root.Physics.threads || 0);
    const olp = new J.ObjectLayerPairFilterTable(NUM_LAYERS);
    olp.EnableCollision(LAYER_STATIC, LAYER_MOVING);
    olp.EnableCollision(LAYER_MOVING, LAYER_MOVING);
    olp.EnableCollision(LAYER_LARVA, LAYER_STATIC);
    olp.EnableCollision(LAYER_LARVA, LAYER_MOVING);      // a larva's own parts do not collide; ghosts collide with nothing
    const bpi = new J.BroadPhaseLayerInterfaceTable(NUM_LAYERS, 2);
    bpi.MapObjectToBroadPhaseLayer(LAYER_STATIC, new J.BroadPhaseLayer(0));
    bpi.MapObjectToBroadPhaseLayer(LAYER_MOVING, new J.BroadPhaseLayer(1));
    bpi.MapObjectToBroadPhaseLayer(LAYER_LARVA, new J.BroadPhaseLayer(1));
    bpi.MapObjectToBroadPhaseLayer(LAYER_GHOST, new J.BroadPhaseLayer(1));
    settings.mObjectLayerPairFilter = olp;
    settings.mBroadPhaseLayerInterface = bpi;
    settings.mObjectVsBroadPhaseLayerFilter = new J.ObjectVsBroadPhaseLayerFilterTable(bpi, 2, olp, NUM_LAYERS);
    const jolt = new J.JoltInterface(settings);
    J.destroy(settings);
    const system = jolt.GetPhysicsSystem();
    const bi = system.GetBodyInterface();
    system.SetGravity(v3(0, -G, 0));
    // small things: contact tolerances in cm
    const ps = system.GetPhysicsSettings();
    ps.mSpeculativeContactDistance = 0.3;
    ps.mPenetrationSlop = 0.003;
    ps.mLinearCastThreshold = 0.5;
    ps.mManifoldTolerance = 0.05;
    ps.mNumVelocitySteps = 30;
    ps.mNumPositionSteps = 10;
    ps.mBaumgarte = 0.8;
    ps.mDeterministicSimulation = true;
    system.SetPhysicsSettings(ps);

    const W = { jolt, system, bi, glasses: [], stones: [], larvae: [], t: 0, names: new Map() };
    W.nameOf = k => W.names.get(k) || ('body ' + (k & 0x7fffff));
    // reused per step, so stepping allocates nothing in the solver's memory
    const TMP = { r: new J.RVec3(), v: new J.Vec3(), q: J.Quat.prototype.sIdentity(), r2: new J.Vec3() };
    W.tune = Object.assign({ springHz: 90, pushHz: 15, substeps: 8, segContact: 0.3, flatS: 0.6 }, opts.tune || {});
    W.skinTouch = new Map();     // other body key → contacts with the larva's soft body this step
    // rigid contacts this step (the head, glasses, stones, floor): pairs of keys, depth, normal
    W.contacts = [];
    const cl = new J.ContactListenerJS();
    const rec = (b1, b2, man) => {
      const a = J.wrapPointer(b1, J.Body).GetID().GetIndexAndSequenceNumber(), b = J.wrapPointer(b2, J.Body).GetID().GetIndexAndSequenceNumber();
      for (const lv of W.larvae) {
        if (lv.segKeys.has(a)) W.skinTouch.set(b, (W.skinTouch.get(b) || 0) + 1);
        if (lv.segKeys.has(b)) W.skinTouch.set(a, (W.skinTouch.get(a) || 0) + 1);
      }
      const m = J.wrapPointer(man, J.ContactManifold), n = m.mWorldSpaceNormal;
      const p = m.GetWorldSpaceContactPointOn1(0);
      W.contacts.push({ a, b, depth: m.mPenetrationDepth, n: { x: n.GetX(), y: n.GetZ(), z: n.GetY() }, at: { x: p.GetX(), y: p.GetZ(), z: p.GetY() } });
    };
    cl.OnContactValidate = () => J.ValidateResult_AcceptAllContactsForThisBodyPair;
    // a segment of the soft body is backed by the skeleton through its spring, so in
    // a contact it counts as heavier than its own small mass: it holds a glass up
    // and still gives a little
    const scale = (b1, b2, io) => {
      const a = J.wrapPointer(b1, J.Body).GetID().GetIndexAndSequenceNumber(), b = J.wrapPointer(b2, J.Body).GetID().GetIndexAndSequenceNumber();
      const st = J.wrapPointer(io, J.ContactSettings);
      for (const lv of W.larvae) {
        if (lv.segKeys.has(a)) { st.mInvMassScale1 = W.tune.segContact; st.mInvInertiaScale1 = W.tune.segContact; }
        if (lv.segKeys.has(b)) { st.mInvMassScale2 = W.tune.segContact; st.mInvInertiaScale2 = W.tune.segContact; }
      }
    };
    cl.OnContactAdded = (b1, b2, man, io) => { scale(b1, b2, io); rec(b1, b2, man); };
    cl.OnContactPersisted = (b1, b2, man, io) => { scale(b1, b2, io); rec(b1, b2, man); };
    cl.OnContactRemoved = () => {};
    system.SetContactListener(cl);

    // the floor
    {
      // no bigger than the bench: a huge box against small pieces loses precision
      const shape = new J.BoxShapeSettings(v3(20, 0.5, 15), 0).Create().Get();
      const cs = new J.BodyCreationSettings(shape, r3(16, -0.5, 10), J.Quat.prototype.sIdentity(), J.EMotionType_Static, LAYER_STATIC);
      cs.mFriction = 0.8; cs.mRestitution = 0;
      W.floor = bi.CreateBody(cs); bi.AddBody(W.floor.GetID(), J.EActivation_DontActivate);
      W.floorId = W.floor.GetID().GetIndexAndSequenceNumber(); W.names.set(W.floorId, 'the floor');
      J.destroy(cs);
    }

    /* A glass: a slab of the given outline (cm, in its own frame) and thickness. */
    W.addGlass = (local, thick, x, y, rot, z = 0) => {
      const hs = new J.ConvexHullShapeSettings();
      for (const q of local) { hs.mPoints.push_back(v3(q.x, 0, q.y)); hs.mPoints.push_back(v3(q.x, thick, q.y)); }
      hs.mMaxConvexRadius = 0.01; hs.mHullTolerance = 0.0005;
      hs.mDensity = GLASS_DENSITY;
      const res = hs.Create(); if (res.HasError()) throw new Error('glass hull: ' + res.GetError().c_str());
      const shape = res.Get();
      const q = J.Quat.prototype.sRotation(v3(0, 1, 0), -rot);   // bench rot is counter-clockwise seen from above
      const cs = new J.BodyCreationSettings(shape, r3(x, z, y), q, J.EMotionType_Dynamic, LAYER_MOVING);
      cs.mFriction = 0.6; cs.mRestitution = 0; cs.mLinearDamping = 0.2; cs.mAngularDamping = 0.4;
      cs.mMotionQuality = J.EMotionQuality_Discrete;
      cs.mUseManifoldReduction = false;     // keep every contact point: it rocks on its edges
      cs.mAllowSleeping = false;            // never put to sleep: a glass balanced on an edge must fall over, not freeze there
      const body = bi.CreateBody(cs); bi.AddBody(body.GetID(), J.EActivation_Activate);
      J.destroy(cs);
      const g = { body, id: body.GetID(), local, thick };
      g.key = g.id.GetIndexAndSequenceNumber(); W.names.set(g.key, 'a glass');
      W.glasses.push(g);
      return g;
    };
    // where a glass is: its outline's points at the bottom and top, in bench coordinates
    W.glassPose = g => {
      const p = g.body.GetPosition(), r = g.body.GetRotation();
      const px = p.GetX(), py = p.GetY(), pz = p.GetZ(), qx = r.GetX(), qy = r.GetY(), qz = r.GetZ(), qw = r.GetW();
      const at = (lx, ly, lz) => { const w = qrot(qx, qy, qz, qw, lx, ly, lz); return { x: w[0] + px, y: w[2] + pz, z: w[1] + py }; };
      return { bottom: g.local.map(q => at(q.x, 0, q.y)), top: g.local.map(q => at(q.x, g.thick, q.y)) };
    };

    /* The larva. Its soft body (tail and middle) is a chain of short rounded
       segments, each held to its place on the skeleton by a stiff spring: the
       skills move the skeleton; the segments follow, and where something presses
       on them they give a little and spring back (a glass on the tail presses it
       down about half a millimetre). The head is hard: a ball the skeleton moves
       outright, that nothing enters. Parts of one larva do not collide with each
       other. */
    W.addLarva = (dims) => {
      const { TAIL_LEN, TAIL_D, MID_LEN, MID_D, HEAD_D } = dims;
      const L = TAIL_LEN + MID_LEN;
      // a sausage of the given length, its cross-section an ellipse h high and w wide
      const sausage = (len, h, w) => {
        const hs = new J.ConvexHullShapeSettings();
        const ring = (y, k) => { for (let i = 0; i < 16; i++) { const a = i / 16 * 2 * Math.PI; hs.mPoints.push_back(v3(Math.cos(a) * w * k, y, Math.sin(a) * h * k)); } };
        ring(-len / 2, 1); ring(len / 2, 1);
        for (const c of [30, 55, 75]) { const a = c * Math.PI / 180, r = Math.min(h, w); ring(-len / 2 - r * Math.sin(a), Math.cos(a)); ring(len / 2 + r * Math.sin(a), Math.cos(a)); }
        hs.mMaxConvexRadius = 0.01; hs.mHullTolerance = 0.0005;
        return hs.Create().Get();
      };
      // the soft tail, pressed from above, flattens: lower and wider, the same cross-section
      const FLAT = [0, 0.25, 0.5, 0.75, 1];
      const tailH = f => TAIL_D / 2 + (MID_D / 2 - TAIL_D / 2) * f, tailW = f => (TAIL_D / 2) * (TAIL_D / 2) / tailH(f);
      // segments: three on the tail, two on the middle; from the tail's end forward
      const cuts = [0, TAIL_LEN / 3, 2 * TAIL_LEN / 3, TAIL_LEN, TAIL_LEN + MID_LEN / 2, L];
      const massOf = (s0, s1) => (s1 <= TAIL_LEN ? 0.49 / TAIL_LEN : 0.23 / MID_LEN) * (s1 - s0);
      const segs = [];
      for (let i = 0; i + 1 < cuts.length; i++) {
        const s0 = cuts[i], s1 = cuts[i + 1], len = s1 - s0, isTail = s1 <= TAIL_LEN, r = isTail ? TAIL_D / 2 : MID_D / 2;
        // as long as the segment, its rounded ends overlapping the next one's
        const shapes = isTail ? FLAT.map(f => sausage(len, tailH(f), tailW(f))) : [new J.CapsuleShapeSettings(Math.max(0.01, len / 2), r).Create().Get()];
        const shape = shapes[0];
        const cs = new J.BodyCreationSettings(shape, r3(0, r + 2, 0), J.Quat.prototype.sIdentity(), J.EMotionType_Dynamic, LAYER_LARVA);
        cs.mFriction = 0.7; cs.mRestitution = 0; cs.mLinearDamping = 2; cs.mAngularDamping = 4;
        cs.mOverrideMassProperties = J.EOverrideMassProperties_CalculateInertia; cs.mMassPropertiesOverride.mMass = massOf(s0, s1);
        cs.mMotionQuality = J.EMotionQuality_LinearCast; cs.mAllowSleeping = false;
        const body = bi.CreateBody(cs); bi.AddBody(body.GetID(), J.EActivation_Activate); J.destroy(cs);
        // its anchor on the skeleton: moved outright, touches nothing
        const as = new J.SphereShapeSettings(0.01).Create().Get();
        const acs = new J.BodyCreationSettings(as, r3(0, r + 2, 0), J.Quat.prototype.sIdentity(), J.EMotionType_Kinematic, LAYER_GHOST);
        const anchor = bi.CreateBody(acs); bi.AddBody(anchor.GetID(), J.EActivation_Activate); J.destroy(acs);
        const c6 = new J.SixDOFConstraintSettings();
        c6.mSpace = J.EConstraintSpace_LocalToBodyCOM;
        for (const ax of [J.SixDOFConstraintSettings_EAxis_TranslationX, J.SixDOFConstraintSettings_EAxis_TranslationY, J.SixDOFConstraintSettings_EAxis_TranslationZ,
          J.SixDOFConstraintSettings_EAxis_RotationX, J.SixDOFConstraintSettings_EAxis_RotationY, J.SixDOFConstraintSettings_EAxis_RotationZ]) {
          c6.SetLimitedAxis(ax, 0, 0);
          // the segment's own frame: x is up and down (the anchor turns +Y onto the body's axis
          // about a level line), y along the body, z sideways. It bears weight stiffly; pushing
          // along or sideways, and twisting, its muscles give way sooner
          const firm = ax === J.SixDOFConstraintSettings_EAxis_TranslationX;
          const sp = c6.get_mLimitsSpringSettings(ax); sp.mFrequency = firm ? W.tune.springHz : W.tune.pushHz; sp.mDamping = 1;
        }
        const con = c6.Create(anchor, body); system.AddConstraint(con); J.destroy(c6);
        const seg = { body, anchor, s0, s1, r, len, isTail, shapes, flat: 0, key: body.GetID().GetIndexAndSequenceNumber(), placed: false };
        W.names.set(seg.key, s1 <= TAIL_LEN ? 'the tail' : 'the middle');
        segs.push(seg);
      }
      const hs = new J.SphereShapeSettings(HEAD_D / 2).Create().Get();
      const hcs = new J.BodyCreationSettings(hs, r3(0, 3, 0), J.Quat.prototype.sIdentity(), J.EMotionType_Kinematic, LAYER_LARVA);
      hcs.mFriction = 0.1; hcs.mRestitution = 0;    // smooth hard chitin
      const head = bi.CreateBody(hcs); bi.AddBody(head.GetID(), J.EActivation_Activate); J.destroy(hcs);
      // the height of the axis above the floor at s: the tail's is lower where it is flattened
      const radius = s => { for (const sg of segs) if (s <= sg.s1 + 1e-9) return sg.isTail ? tailH(FLAT[sg.flat]) : MID_D / 2; return MID_D / 2; };
      const larva = { segs, head, L, radius, tailH, tailW, FLAT, headR: HEAD_D / 2, headKey: head.GetID().GetIndexAndSequenceNumber(), segKeys: new Set(segs.map(q => q.key)) };
      larva.keys = new Set([...larva.segKeys, larva.headKey]);
      W.names.set(larva.headKey, 'the head');
      W.larvae.push(larva);
      return larva;
    };

    // a rotation taking Jolt's +Y (a capsule's axis) onto the direction d
    const quatYto = (dx, dy, dz) => {
      const n = Math.hypot(dx, dy, dz) || 1; dx /= n; dy /= n; dz /= n;
      const c = dy;                                   // cos of the angle between +Y and d
      if (c < -0.9999) return [1, 0, 0, 0];
      // axis = Y × d = (dz, 0, -dx)
      const ax = dz, az = -dx, s2 = Math.sqrt(2 * (1 + c));
      return [ax / s2, 0, az / s2, s2 / 2];
    };

    /* Move the skeleton. spine(s) gives, for arc length s from the tail's end,
       the axis point (bench coordinates, z up) and the direction along the body.
       head: the head's centre. Placed outright the first time, then moved over dt. */
    W.setPose = (larva, spine, headAt, dt) => {
      for (const sg of larva.segs) {
        // the segment lies along the spine's direction at its middle, its axis at the segment's own height
        const a = spine(sg.s0), b = spine(sg.s1), m = spine((sg.s0 + sg.s1) / 2);
        const pm = toJ(m.x, m.y, m.z), d = toJ(b.x - a.x, b.y - a.y, (b.z - a.z) - ((b.zr || 0) - (a.zr || 0)));
        const q = quatYto(d[0], d[1], d[2]);
        TMP.r.Set(pm[0], pm[1], pm[2]);
        const Q = new J.Quat(q[0], q[1], q[2], q[3]);
        if (sg.placed) bi.MoveKinematic(sg.anchor.GetID(), TMP.r, Q, dt);
        else {
          bi.SetPositionAndRotation(sg.anchor.GetID(), TMP.r, Q, J.EActivation_Activate);
          bi.SetPositionAndRotation(sg.body.GetID(), TMP.r, Q, J.EActivation_Activate);
          sg.placed = true;
        }
        J.destroy(Q);
      }
      const hp = toJ(headAt.x, headAt.y, headAt.z);
      TMP.r.Set(hp[0], hp[1], hp[2]);
      if (larva.headPlaced) bi.MoveKinematic(larva.head.GetID(), TMP.r, TMP.q, dt);
      else { bi.SetPosition(larva.head.GetID(), TMP.r, J.EActivation_Activate); larva.headPlaced = true; }
    };

    // the soft body's surface as points (bench coordinates): rings round each segment
    W.skinPoints = larva => {
      const out = [];
      for (const sg of larva.segs) {
        const p = sg.body.GetPosition(), r = sg.body.GetRotation(), qx = r.GetX(), qy = r.GetY(), qz = r.GetZ(), qw = r.GetW();
        const n = 4;
        for (let i = 0; i <= n; i++) {
          const y = -sg.len / 2 + sg.len * i / n;
          for (let k = 0; k < 10; k++) {
            const t = k / 10 * 2 * Math.PI, w = qrot(qx, qy, qz, qw, Math.cos(t) * sg.r, y, Math.sin(t) * sg.r);
            out.push({ x: w[0] + p.GetX(), y: w[2] + p.GetZ(), z: w[1] + p.GetY(), s: sg.s0 + (sg.s1 - sg.s0) * i / n, seg: sg.key });
          }
        }
      }
      return out;
    };
    // how far each segment has been pushed off its place on the skeleton (cm)
    W.give = larva => larva.segs.map(sg => { const a = sg.anchor.GetPosition(), b = sg.body.GetPosition(); return Math.hypot(a.GetX() - b.GetX(), a.GetY() - b.GetY(), a.GetZ() - b.GetZ()); });
    W.headPoint = larva => { const p = larva.head.GetPosition(); return { x: p.GetX(), y: p.GetZ(), z: p.GetY() }; };

    W.pushGlass = (g, fx, fy, fz, at) => {   // a force (g·cm/s²) on a glass at a point (bench coordinates)
      const f = toJ(fx, fy, fz), p = toJ(at.x, at.y, at.z);
      TMP.v.Set(f[0], f[1], f[2]); TMP.r.Set(p[0], p[1], p[2]);
      bi.AddForce(g.id, TMP.v, TMP.r, J.EActivation_Activate);
    };
    // the legs drive a glass that lies on the body: a velocity, horizontal, and a turn about the vertical
    W.driveGlass = (g, vx, vy, w) => {
      const lv = bi.GetLinearVelocity(g.id), av = bi.GetAngularVelocity(g.id);
      TMP.v.Set(vx, lv.GetY(), vy); bi.SetLinearVelocity(g.id, TMP.v);
      TMP.v.Set(av.GetX(), -w, av.GetZ()); bi.SetAngularVelocity(g.id, TMP.v);
    };
    // the legs move a glass that lies on the body: with force, against the friction
    // of what it rests on, toward a horizontal velocity and a turn about the vertical;
    // at most maxF of force (and the torque that force gives at 1 cm)
    W.legsOnGlass = (g, vx, vy, w, maxF, dt) => {
      const v = g.body.GetLinearVelocity(), av = g.body.GetAngularVelocity(), mp = g.body.GetMotionProperties();
      const m = 1 / mp.GetInverseMass(), I = m * 1.2 * 1.2, mu = 0.7;
      const sp = Math.hypot(vx, vy);
      let fx = (vx - v.GetX()) * m / dt + (sp > 1e-6 ? vx / sp * mu * m * G : 0);
      let fz = (vy - v.GetZ()) * m / dt + (sp > 1e-6 ? vy / sp * mu * m * G : 0);
      const f = Math.hypot(fx, fz); if (f > maxF) { fx *= maxF / f; fz *= maxF / f; }
      let ty = (-w - av.GetY()) * I / dt + (Math.abs(w) > 1e-6 ? -Math.sign(w) * mu * m * G * 0.8 : 0);
      ty = Math.max(-maxF, Math.min(maxF, ty));
      TMP.v.Set(fx, 0, fz); TMP.r2.Set(0, ty, 0);
      bi.AddForceAndTorque(g.id, TMP.v, TMP.r2, J.EActivation_Activate);
    };
    /* The legs grip a glass that lies on the body: they hold it from sliding off
       and move it across the body. The glass is held round the vertical and in
       the floor's plane, through a stiff spring (the legs give a little); up and
       down, and its tilt, are left to what it rests on. */
    W.grip = g => {
      if (g.grip) return g.grip;
      const p = g.body.GetCenterOfMassPosition(), r = g.body.GetRotation();
      const as = new J.SphereShapeSettings(0.01).Create().Get();
      TMP.r.Set(p.GetX(), p.GetY(), p.GetZ());
      const yaw = W.glassAngle(g);
      const q = J.Quat.prototype.sRotation(v3(0, 1, 0), -yaw);
      const acs = new J.BodyCreationSettings(as, TMP.r, q, J.EMotionType_Kinematic, LAYER_GHOST);
      const hand = bi.CreateBody(acs); bi.AddBody(hand.GetID(), J.EActivation_Activate); J.destroy(acs);
      const c6 = new J.SixDOFConstraintSettings();
      c6.mSpace = J.EConstraintSpace_WorldSpace;
      c6.mPosition1 = r3(p.GetX(), p.GetY(), p.GetZ()); c6.mPosition2 = r3(p.GetX(), p.GetY(), p.GetZ());
      for (const ax of [J.SixDOFConstraintSettings_EAxis_TranslationX, J.SixDOFConstraintSettings_EAxis_TranslationZ, J.SixDOFConstraintSettings_EAxis_RotationY]) {
        c6.SetLimitedAxis(ax, 0, 0); const sp = c6.get_mLimitsSpringSettings(ax); sp.mFrequency = 30; sp.mDamping = 1;
      }
      for (const ax of [J.SixDOFConstraintSettings_EAxis_TranslationY, J.SixDOFConstraintSettings_EAxis_RotationX, J.SixDOFConstraintSettings_EAxis_RotationZ]) c6.MakeFreeAxis(ax);
      const con = c6.Create(hand, g.body); system.AddConstraint(con); J.destroy(c6);
      g.grip = { hand, con, x: p.GetX(), y: p.GetZ(), z: p.GetY(), yaw };
      return g.grip;
    };
    // move the gripping legs: the glass's centre to (x, y) and its turn to yaw, over dt
    W.moveGrip = (g, x, y, yaw, dt) => {
      const G = g.grip; G.x = x; G.y = y; G.yaw = yaw;
      TMP.r.Set(x, G.z, y);
      const q = J.Quat.prototype.sRotation(v3(0, 1, 0), -yaw);
      bi.MoveKinematic(G.hand.GetID(), TMP.r, q, dt);
    };
    // a hand lowering a glass: how much of its weight it carries itself (0 held, 1 let go)
    W.setWeight = (g, f) => bi.SetGravityFactor(g.id, f);
    /* Jaws: they take a glass at one point (fixed in the glass) and hold that point
       where they are moved to, through a stiff spring; the glass is free to turn
       about it. */
    W.jaws = (g, at) => {
      const as = new J.SphereShapeSettings(0.01).Create().Get();
      TMP.r.Set(at.x, at.z, at.y);
      const acs = new J.BodyCreationSettings(as, TMP.r, TMP.q, J.EMotionType_Kinematic, LAYER_GHOST);
      const hand = bi.CreateBody(acs); bi.AddBody(hand.GetID(), J.EActivation_Activate); J.destroy(acs);
      const c6 = new J.SixDOFConstraintSettings();
      c6.mSpace = J.EConstraintSpace_WorldSpace;
      c6.mPosition1 = r3(at.x, at.z, at.y); c6.mPosition2 = r3(at.x, at.z, at.y);
      // they hold that point firmly (through a stiff spring); the glass is free to turn about it
      for (const ax of [J.SixDOFConstraintSettings_EAxis_TranslationX, J.SixDOFConstraintSettings_EAxis_TranslationY, J.SixDOFConstraintSettings_EAxis_TranslationZ]) {
        c6.SetLimitedAxis(ax, 0, 0); const sp = c6.get_mLimitsSpringSettings(ax); sp.mFrequency = 20; sp.mDamping = 1;
      }
      for (const ax of [J.SixDOFConstraintSettings_EAxis_RotationX, J.SixDOFConstraintSettings_EAxis_RotationY, J.SixDOFConstraintSettings_EAxis_RotationZ]) c6.MakeFreeAxis(ax);
      const con = c6.Create(hand, g.body); system.AddConstraint(con); J.destroy(c6);
      const jw = { hand, con, x: at.x, y: at.y, z: at.z };

<body>
<div id="bench-host"></div>

<script>
/* ============================================================
   SKILL BENCH — one larva, one body skill at a time, pure geometry.
   No forces, no senses, no behaviour rules: the observer sets the
   target, the body shows whether it can do the skill.
   Units: centimetres and seconds; the world's y axis points up.
   ============================================================ */

const DEG = Math.PI / 180;
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };

/* ---------------- BODY: three sausages ----------------
   tail and middle soft, head hard. The legs (three pairs, on the
   middle) and the jaws are not drawn. The joints are under a sleeve,
   so nothing can get caught in them. */
const BODY = {
  TAIL_LEN: 1.5,  TAIL_D: 0.7,   // tail, 0.49 g
  MID_LEN: 1.0,   MID_D: 0.6,    // middle with the legs, 0.23 g
  HEAD_D: 0.5,                   // head, 0.07 g
  ANCHOR: 0.75                   // the tail bears on the ground at its centre
};
/* Under a glass the soft tail is pressed flat to the middle's height, so the
   larva bears the glass on tail and middle alike and the glass lies level.
   The tail keeps its cross-section: lower, so wider. body.flat: 0 round, 1 flat. */
const GLASS_REST = BODY.MID_D;                                  // cm: underside of a glass lying on the larva
function tailHalfH(body) { return BODY.TAIL_D / 2 + ((GLASS_REST - BODY.TAIL_D) / 2) * (body.flat || 0); }
// under a glass the hard head is held lower, so its top is no higher than the
// middle's back: the glass lies on the back, not on the head (still off the ground)
const HEAD_LIFT_UNDER = Math.asin((GLASS_REST - BODY.MID_D / 2 - BODY.HEAD_D / 2) / (BODY.HEAD_D / 2));
// height of the head's centre above the floor
function headZ(body) { return BODY.MID_D / 2 + BODY.HEAD_D / 2 * Math.sin(body.headLift); }
function tailHalfW(body) { return BODY.TAIL_D / 2 + (BODY.TAIL_D * BODY.TAIL_D / GLASS_REST - BODY.TAIL_D) / 2 * (body.flat || 0); }

/* ---------------- BODY: joints ----------------
   Both joints are the same and bend the same way in every direction.
   The one number is the least that allows every pose on the list:
   the hook (drawing: tail folded about 110° to the middle). */
const JOINT = {
  BEND: 120,    // tail–middle, deg, any direction: toward the legs, the back, either side, up
  TWIST: 90,    // deg: fore-body twisted under itself legs first; rolling over the back
  // The head is not the tail: it bends a little toward the chest, where the
  // legs are, and only just tilts back toward the back. On the back the same
  // two limits are its left and right.
  HEAD_LEGS: 40,   // deg, toward the chest / legs
  HEAD_BACK: 10    // deg, toward the back

/* ---------------- BODY: gait (measured from video) ---------------- */
const GAIT = {
  STROKE_S: 2.0,       // one tail stroke, seconds
  STEP: 0.24,          // ground gained per stroke, cm
  SWEEP_SIDE: 75,      // on a side: tail curled toward the legs, every stroke, deg (measured)
  // On the back (from the video, 39–59 s, measured at 10 frames a second): the
  // body bends like a C to one side and pumps there between about 20° and 45°
  // once a stroke, for about four strokes, then goes over to the other side.
  SWEEP_BACK: 35,      // tail–middle bend at the start of a push, deg
  BACK_MIN: 15,        // ...and at its end: the tail does not straighten fully, deg
  BACK_C: 0.3,         // the head bends to the same side as the tail, by this share
  BOUT_MIN: 3, BOUT_MAX: 5,   // strokes to one side before going over to the other
  LIFT: 20,            // tail lift while it swings, deg
  HEAD_LIFT: 30,       // the head is held up off the ground, never laid on it, deg
  SCAN: 12,            // the head sways side to side, scanning, ± deg, once a stroke
  FRONT_SWING: 30,     // between pushes the front swings round at most this fast, deg/s
  TEMPO_SPREAD: 0.15,  // individual tempo ±15 %
  HEAD_RATE: 40        // the head turns smoothly, at most this fast, deg/s

// Which way the legs face, as seen from above: +1 = right of the heading,
// -1 = left, 0 = up (lying on the back). This changes only what is drawn
// and the words used; the joints are the same whichever side is down.
const POSTURES = {
  left:  { label: 'left side',  legs: +1 },
  right: { label: 'right side', legs: -1 },
  back:  { label: 'back',       legs: 0 }

  const P = POSTURES[posture];
  const BEND = JOINT.BEND * DEG;
  const b = {
    posture, label: P.label, legs: P.legs,
    // roll about the long axis: 0 = on the left side, 90° = on the back, 180° = on the right side
    rho: (posture === 'left' ? 0 : posture === 'back' ? 90 : 180) * DEG,
    x: 0, y: 0, psi: 0,      // the tail–middle joint, and the heading of the middle
    beta: 0,                 // tail–middle bend in the floor plane, + = tail to the right
    lam: 0,                  // tail lift off the floor
    delta: 0,                // middle–head bend in the floor plane, + = head to the right
    tempo: 1 + rnd.range(-GAIT.TEMPO_SPREAD, GAIT.TEMPO_SPREAD),
    nextSign: rnd.sign(), scanPhase: rnd.range(0, 2 * Math.PI), bout: 0, rndBout: rnd,

      // the head is tilted up, so seen from above it sits a little closer
      head: { x: MH.x + h.x * BODY.HEAD_D / 2 * Math.cos(b.headLift), y: MH.y + h.y * BODY.HEAD_D / 2 * Math.cos(b.headLift) },

  // the stroke itself: it is straightening on the floor while it pushes.

  // one tick. cmd = {go, aim}: aim is the wanted head bend, + = right

    if (cmd.go) b.scanPhase += 2 * Math.PI * dt * b.tempo / GAIT.STROKE_S;
    const scan = cmd.go ? GAIT.SCAN * DEG * Math.sin(b.scanPhase) : 0;
    // The head does not steer: it sways left and right, scanning for carbon
    // dioxide and taking any collision first. The turning is done by swinging
    // the front round (below), so the larva follows its middle, not its head.
    const steer = 0;
    // on the back the whole body is a C: the head follows the tail's side
    const cBend = P.legs === 0 ? GAIT.BACK_C * b.beta : 0;
    const want = b.clampHead(steer + scan + cBend);
    const rate = GAIT.HEAD_RATE * DEG * dt;
    b.delta += clamp(wrap(want - b.delta), -rate, rate);

    // Between pushes the front is swung round toward the target, the whole body
    // pivoting at the tail–middle joint. During a push the front goes straight.
    const pushingNow = b.inStroke && !b.halted && b.f >= 0.45 && b.f < 0.95;
    if (cmd.go && !pushingNow) {
      const turn = clamp(cmd.aim || 0, -GAIT.FRONT_SWING * DEG * dt, GAIT.FRONT_SWING * DEG * dt);
      b.psi = wrap(b.psi - turn);
    }

    if (!b.inStroke) {
      b.pushing = false;
      if (!cmd.go) { b.phase = 'still'; b.lam = P.legs === 0 ? GAIT.LIFT * DEG : 0; return; }
      b.inStroke = true; b.f = 0; b.pushed = 0; b.halted = false;
      // on a side the tail always curls toward the legs; on the back it alternates

        }
        b.bout--;
      }
      b.betaS = b.beta; b.lamS = b.lam;
    }

    if (!cmd.go && !b.halted) { b.halted = true; b.betaH = b.beta; b.lamH = b.lam; b.fH = b.f; }
    b.f += dt * b.tempo / GAIT.STROKE_S;

      const g = clamp((f - b.fH) / 0.2, 0, 1);

      b.lam = b.lamH + (restLam - b.lamH) * smooth(g);

      if (g >= 1) { b.inStroke = false; b.phase = 'still'; }

    }

    // its widest bend, and pushes while it straightens on the floor. Straight
    // again, it comes up for the next stroke.
    if (f < 0.05) {                                     // lift
      b.lam = b.lamS + (L - b.lamS) * smooth(f / 0.05);
      b.phase = 'lift';
    } else if (f < 0.38) {                              // swing out, in the air

      b.beta = b.betaS + (target - b.betaS) * smooth((f - 0.05) / 0.33);

    } else if (f < 0.45) {                              // laid down at the widest bend

      b.lam = L * (1 - smooth((f - 0.38) / 0.07));

      case 'rest': return 'tail straight on the floor';
      case 'lift': return 'tail coming up off the floor';

      case 'set': return 'tail laid on the floor at its widest bend';
      case 'push': return 'tail straightening on the floor, pushing the front forward ' + (b.pushed * 10).toFixed(1) + ' of ' + (GAIT.STEP * 10).toFixed(1) + ' mm';
      case 'recover': return 'stopping — tail straightening';
    }
    return '';
  };
  return b;
}

/* ---------------- WORLD + the simulation the harness runs ---------------- */
const ARENA = { W: 32, H: 20 };   // a bare test floor, cm
const PX = 40;                     // px per cm: 0.5 mm = 2 px
const TARGET_R = 0.3;
const MAX_TIME = 900;              // s

const SKILLS = [
